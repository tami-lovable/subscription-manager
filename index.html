<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 구독료 한눈에 보기</title>
<style>
  :root{
    --bg:#000000; --card:#0d0d0d; --ink:#ffffff; --sub:#a8a8b3;
    --accent:#ff2e93; --accent-dark:#d11a77; --line:#2a2a33; --soft:#1a1a1a;
    --lime:#c6ff00; --cyan:#00e5ff;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    line-height:1.5; min-height:100vh;
  }
  .wrap{max-width:520px; margin:0 auto; padding:40px 20px 56px}
  .eyebrow{font-size:13px; letter-spacing:.08em; color:var(--accent); font-weight:700; margin:0 0 10px}
  h1{font-size:28px; line-height:1.3; margin:0 0 10px; font-weight:800; letter-spacing:-.02em}
  .lead{color:var(--sub); font-size:15px; margin:0 0 28px}

  .total{
    background:#000; border:2px solid var(--lime); color:#fff; border-radius:24px; padding:26px 24px; margin-bottom:20px;
    box-shadow:0 0 24px rgba(198,255,0,.25);
  }
  .total .label{font-size:13px; color:var(--cyan); font-weight:700; margin:0 0 6px}
  .total .num{font-size:42px; font-weight:800; letter-spacing:-.02em; word-break:keep-all; color:var(--lime)}
  .total .num small{font-size:18px; font-weight:600; margin-left:2px}
  .total .count{font-size:13px; color:var(--sub); margin:8px 0 0}

  .card{background:var(--card); border:1px solid var(--line); border-radius:24px; padding:20px; margin-bottom:20px}
  .card h2{font-size:16px; margin:0 0 14px}
  form{display:grid; gap:10px}
  label{font-size:13px; color:var(--sub); display:block; margin-bottom:4px}
  input{
    width:100%; font-size:16px; padding:13px 14px; border:1px solid var(--line); border-radius:14px;
    background:#000; color:var(--ink); font-family:inherit;
  }
  input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  button{font-family:inherit; cursor:pointer}
  .primary{
    background:var(--accent); color:#000; border:0; border-radius:14px; padding:14px; font-size:16px; font-weight:800;
  }
  .primary:active{background:var(--accent-dark)}
  .card h2{color:var(--cyan)}
  .price{color:var(--lime)}
  .ghost{
    background:transparent; border:1px solid var(--line); color:var(--sub); border-radius:14px; padding:14px; font-size:15px;
  }
  .row2{display:grid; grid-template-columns:1fr; gap:10px}
  .btns{display:grid; grid-template-columns:1fr; gap:8px}
  .btns.editing{grid-template-columns:2fr 1fr}

  ul{list-style:none; margin:0; padding:0}
  li{
    display:flex; align-items:center; gap:10px; padding:14px 0; border-top:1px solid var(--line);
  }
  li:first-child{border-top:0; padding-top:4px}
  .info{flex:1; min-width:0}
  .name{font-weight:700; font-size:16px; overflow-wrap:anywhere}
  .price{color:var(--sub); font-size:14px}
  .acts{display:flex; gap:6px}
  .mini{
    border:1px solid var(--line); background:#000; border-radius:10px; padding:8px 12px; font-size:13px; color:var(--cyan);
  }
  .mini.del{color:var(--accent)}
  .empty{color:var(--sub); font-size:14px; text-align:center; padding:18px 0 6px}
  .note{color:var(--sub); font-size:12px; text-align:center; margin-top:8px}
  .err{color:var(--accent); font-size:13px; min-height:18px; margin:0}

  @media (min-width:480px){
    .row2{grid-template-columns:1.4fr 1fr}
    h1{font-size:32px}
  }
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">MY SUBSCRIPTIONS</p>
  <h1>내 구독료,<br>한눈에 보기</h1>
  <p class="lead">구독 서비스와 금액을 적으면<br>한 달 구독료 총액을 자동으로 계산해 드려요.</p>

  <section class="total" aria-live="polite">
    <p class="label">월 구독료 총액</p>
    <div class="num"><span id="total">0</span><small>원</small></div>
    <p class="count" id="count">아직 등록한 구독이 없어요</p>
  </section>

  <section class="card">
    <h2 id="formTitle">구독 추가하기</h2>
    <form id="form" autocomplete="off">
      <div class="row2">
        <div>
          <label for="name">서비스 이름</label>
          <input id="name" type="text" maxlength="40" placeholder="서비스 이름 입력" required>
        </div>
        <div>
          <label for="price">월 금액 (원)</label>
          <input id="price" type="text" inputmode="numeric" placeholder="0" required>
        </div>
      </div>
      <p class="err" id="err"></p>
      <div class="btns" id="btns">
        <button class="primary" type="submit" id="submitBtn">추가</button>
        <button class="ghost" type="button" id="cancelBtn" hidden>취소</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>내 구독 목록</h2>
    <ul id="list"></ul>
    <p class="empty" id="empty">위에서 첫 구독을 추가해 보세요.</p>
    <p class="note">목록은 이 기기의 이 브라우저에 저장돼요.</p>
  </section>
</main>

<script>
(function(){
  var KEY = "subscription-list-v1";
  var items = [];
  var editingId = null;

  var $ = function(id){ return document.getElementById(id); };
  var nameEl = $("name"), priceEl = $("price"), errEl = $("err");

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      items = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(items)) items = [];
    }catch(e){ items = []; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(items)); }
    catch(e){ errEl.textContent = "저장에 실패했어요. 브라우저 설정을 확인해 주세요."; }
  }
  function won(n){ return Number(n).toLocaleString("ko-KR"); }
  function parsePrice(s){
    var n = parseInt(String(s).replace(/[^0-9]/g,""), 10);
    return isNaN(n) ? null : n;
  }

  function render(){
    var list = $("list");
    list.innerHTML = "";
    var sum = 0;
    items.forEach(function(it){
      sum += it.price;
      var li = document.createElement("li");

      var info = document.createElement("div");
      info.className = "info";
      var nm = document.createElement("div");
      nm.className = "name"; nm.textContent = it.name;
      var pr = document.createElement("div");
      pr.className = "price"; pr.textContent = "월 " + won(it.price) + "원";
      info.appendChild(nm); info.appendChild(pr);

      var acts = document.createElement("div");
      acts.className = "acts";
      var eb = document.createElement("button");
      eb.className = "mini"; eb.type = "button"; eb.textContent = "수정";
      eb.onclick = function(){ startEdit(it.id); };
      var db = document.createElement("button");
      db.className = "mini del"; db.type = "button"; db.textContent = "삭제";
      db.onclick = function(){ remove(it.id); };
      acts.appendChild(eb); acts.appendChild(db);

      li.appendChild(info); li.appendChild(acts);
      list.appendChild(li);
    });
    $("total").textContent = won(sum);
    $("count").textContent = items.length ? ("구독 " + items.length + "개") : "아직 등록한 구독이 없어요";
    $("empty").hidden = items.length > 0;
  }

  function resetForm(){
    editingId = null;
    nameEl.value = ""; priceEl.value = ""; errEl.textContent = "";
    $("formTitle").textContent = "구독 추가하기";
    $("submitBtn").textContent = "추가";
    $("cancelBtn").hidden = true;
    $("btns").className = "btns";
  }
  function startEdit(id){
    var it = items.filter(function(x){ return x.id === id; })[0];
    if(!it) return;
    editingId = id;
    nameEl.value = it.name; priceEl.value = it.price;
    errEl.textContent = "";
    $("formTitle").textContent = "구독 수정하기";
    $("submitBtn").textContent = "수정 저장";
    $("cancelBtn").hidden = false;
    $("btns").className = "btns editing";
    nameEl.focus();
    window.scrollTo({top: $("form").offsetTop - 120, behavior: "smooth"});
  }
  function remove(id){
    var it = items.filter(function(x){ return x.id === id; })[0];
    if(!it) return;
    if(!window.confirm("'" + it.name + "'을(를) 삭제할까요?")) return;
    items = items.filter(function(x){ return x.id !== id; });
    if(editingId === id) resetForm();
    save(); render();
  }

  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var name = nameEl.value.trim();
    var price = parsePrice(priceEl.value);
    if(!name){ errEl.textContent = "서비스 이름을 입력해 주세요."; return; }
    if(price === null){ errEl.textContent = "금액은 숫자로 입력해 주세요."; return; }
    if(editingId){
      items = items.map(function(x){
        return x.id === editingId ? {id:x.id, name:name, price:price} : x;
      });
    }else{
      items.push({id: Date.now() + "-" + Math.random().toString(36).slice(2,7), name:name, price:price});
    }
    save(); render(); resetForm();
  });
  $("cancelBtn").addEventListener("click", resetForm);

  load(); render();
})();
</script>
</body>
</html>
